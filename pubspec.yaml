name: flutter_ai_template
description: A minimal Flutter template with login, home and an AI development workflow.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  go_router: 16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist_Regular.ttf
        - asset: assets/fonts/Urbanist_Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist_SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist_Bold.ttf
          weight: 700
